<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: shop catalogue. Sticky top bar: brand and search, a row of the ten domains, and a row of the chosen domain's categories; both rows wrap, nothing scrolls sideways. Below: sticky sidebar of the open category's departments and shelves; main column with the whole category, department by department. */
:root {
  --bg: #eef0ec; --paper: #fbfcf9; --ink: #1c211d; --muted: #59625b; --rule: #cfd5cd;
  --accent: #2f5b3c; --accent-ink: #f4f7f1; --flag: #f2c230; --flag-ink: #2b2405; --soft: #e1e9df;
  --sign: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141815; --paper: #1b201c; --ink: #e5eae3; --muted: #9ba69c; --rule: #2f3730;
  --accent: #8cc79c; --accent-ink: #102015; --flag: #e8b923; --flag-ink: #241d02; --soft: #223026; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141815; --paper: #1b201c; --ink: #e5eae3; --muted: #9ba69c; --rule: #2f3730;
  --accent: #8cc79c; --accent-ink: #102015; --flag: #e8b923; --flag-ink: #241d02; --soft: #223026; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top { max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding-block: 12px 8px; }
h1 { font: 800 26px/1 var(--sign); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
#q { margin-left: auto; width: min(100%, 360px); font: 16px/1.2 var(--body); padding: 9px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); }
.navrows { max-width: 1320px; margin: 0 auto; display: grid; gap: 6px; padding-block: 0 10px; }
.doms, .cats { display: flex; flex-wrap: wrap; gap: 4px; }
.dom { font: 600 15px/1 var(--sign); letter-spacing: .04em; text-transform: uppercase; padding: 7px 10px 6px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
.dom:hover { color: var(--ink); background: var(--soft); }
.dom[aria-current="true"] { color: var(--ink); background: var(--soft); box-shadow: inset 0 -3px 0 var(--accent); }
.cats { padding-top: 6px; border-top: 1px solid var(--rule); }
.cat { font: 600 15px/1.05 var(--sign); letter-spacing: .03em; text-transform: uppercase; padding: 7px 10px 6px; border-radius: 4px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; text-align: left; }
.cat small { display: block; font: 500 10px/1.2 var(--mono); color: var(--muted); letter-spacing: 0; text-transform: none; margin-top: 2px; }
.cat[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cat[aria-current="true"] small { color: var(--accent-ink); opacity: .8; }
button:focus-visible, #q:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 22px 70px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; }
nav.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hh, 150px) + 16px); align-self: start; max-height: calc(100vh - var(--hh, 150px) - 32px); overflow-y: auto; font: 14px/1.35 var(--body); padding-right: 4px; }
.side h2 { font: 700 13px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.side ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.side .d > a { font: 700 16px/1.2 var(--sign); letter-spacing: .03em; text-transform: uppercase; color: var(--ink); margin-top: 10px; }
.side a { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; }
.side a span { color: var(--muted); font: 500 11px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
.side a:hover { background: var(--soft); }
.side a.on { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
.side ol ol { padding-left: 8px; }
main { min-width: 0; display: grid; gap: 26px; align-content: start; }
.cat-head h2 { font: 800 46px/1 var(--sign); text-transform: uppercase; margin: 0; text-wrap: balance; }
.cat-head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; max-width: 72ch; }
.note { font: 13px/1.45 var(--body); color: var(--muted); border: 1px dashed var(--rule); border-radius: 6px; padding: 8px 12px; max-width: 72ch; }
section.dept { display: grid; gap: 16px; scroll-margin-top: calc(var(--hh, 150px) + 12px); }
h3.dept-name { font: 800 32px/1 var(--sign); text-transform: uppercase; margin: 8px 0 0; padding-top: 12px; border-top: 4px solid var(--ink); }
.best { background: var(--paper); border: 1px solid var(--rule); border-left: 6px solid var(--flag); border-radius: 6px; padding: 12px 16px; max-width: 80ch; }
.best h4 { font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.best ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15px; }
.best b { font-weight: 600; } .best .v { font-style: italic; color: var(--muted); }
section.shelf { display: grid; gap: 10px; scroll-margin-top: calc(var(--hh, 150px) + 12px); }
h4.shelf-name { font: 700 21px/1.1 var(--sign); letter-spacing: .02em; text-transform: uppercase; margin: 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
h4.shelf-name span { font: 500 12px/1 var(--mono); color: var(--muted); text-transform: none; letter-spacing: 0; }
h4.shelf-name em { font: 500 13px/1 var(--body); font-style: normal; color: var(--muted); text-transform: none; letter-spacing: 0; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; align-items: start; }
article.item { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 11px 13px; display: grid; gap: 5px; min-width: 0; }
article.item h5 { font: 600 16.5px/1.3 var(--body); margin: 0; }
.also { font: 13px/1.4 var(--body); color: var(--muted); margin: 0; }
.desc { font: 14.5px/1.5 var(--body); margin: 0; }
details.models summary { cursor: pointer; font: 600 13px/1.3 var(--body); color: var(--accent); list-style: none; }
details.models summary::-webkit-details-marker { display: none; }
details.models summary::before { content: "+ "; font-family: var(--mono); }
details.models[open] summary::before { content: "− "; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; max-height: 320px; overflow-y: auto; }
.chip { font: 13px/1.3 var(--body); background: var(--soft); border-radius: 4px; padding: 3px 7px; }
.chip i { font-style: normal; color: var(--muted); margin-left: 5px; }
.chip.range { background: transparent; border: 1px solid var(--rule); }
.src { font: 12px/1.3 var(--mono); margin: 0; } .src a { color: var(--muted); }
.none { color: var(--muted); font: 15px/1.5 var(--body); }
.hits { display: grid; gap: 4px; }
.hit { display: flex; justify-content: space-between; gap: 12px; text-align: left; font: 15px/1.4 var(--body); padding: 7px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); cursor: pointer; }
.hit i { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
mark { background: var(--flag); color: var(--flag-ink); padding: 0 1px; border-radius: 2px; }
@media (max-width: 880px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; } nav.side { position: static; max-height: 260px; border: 1px solid var(--rule); border-radius: 6px; padding: 10px; background: var(--paper); } #q { margin-left: 0; width: 100%; } header { position: static; } section.dept, section.shelf { scroll-margin-top: 12px; } .cat-head h2 { font-size: 36px; } }
@media (max-width: 560px) { .items { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
