<style>
/* Layout: shop catalogue. Sticky top bar: brand and search, a row of the ten domains, and a row of the chosen domain's categories; both rows wrap, nothing scrolls sideways. Below: sticky sidebar of the open category's departments and shelves; main column with the whole category, department by department. */
:root {
  --bg: #eef0ec; --paper: #fbfcf9; --ink: #1c211d; --muted: #59625b; --rule: #cfd5cd;
  --accent: #2f5b3c; --accent-ink: #f4f7f1; --flag: #f2c230; --flag-ink: #2b2405; --soft: #e1e9df;
  --sign: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141815; --paper: #1b201c; --ink: #e5eae3; --muted: #9ba69c; --rule: #2f3730;
  --accent: #8cc79c; --accent-ink: #102015; --flag: #e8b923; --flag-ink: #241d02; --soft: #223026; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141815; --paper: #1b201c; --ink: #e5eae3; --muted: #9ba69c; --rule: #2f3730;
  --accent: #8cc79c; --accent-ink: #102015; --flag: #e8b923; --flag-ink: #241d02; --soft: #223026; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top { max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding-block: 12px 8px; }
h1 { font: 800 26px/1 var(--sign); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
#q { margin-left: auto; width: min(100%, 360px); font: 16px/1.2 var(--body); padding: 9px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); }
.navrows { max-width: 1320px; margin: 0 auto; display: grid; gap: 6px; padding-block: 0 10px; }
.doms, .cats { display: flex; flex-wrap: wrap; gap: 4px; }
.dom { font: 600 15px/1 var(--sign); letter-spacing: .04em; text-transform: uppercase; padding: 7px 10px 6px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
.dom:hover { color: var(--ink); background: var(--soft); }
.dom[aria-current="true"] { color: var(--ink); background: var(--soft); box-shadow: inset 0 -3px 0 var(--accent); }
.cats { padding-top: 6px; border-top: 1px solid var(--rule); }
.cat { font: 600 15px/1.05 var(--sign); letter-spacing: .03em; text-transform: uppercase; padding: 7px 10px 6px; border-radius: 4px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; text-align: left; }
.cat small { display: block; font: 500 10px/1.2 var(--mono); color: var(--muted); letter-spacing: 0; text-transform: none; margin-top: 2px; }
.cat[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cat[aria-current="true"] small { color: var(--accent-ink); opacity: .8; }
button:focus-visible, #q:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 22px 70px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; }
nav.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hh, 150px) + 16px); align-self: start; max-height: calc(100vh - var(--hh, 150px) - 32px); overflow-y: auto; font: 14px/1.35 var(--body); padding-right: 4px; }
.side h2 { font: 700 13px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.side ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.side .d > a { font: 700 16px/1.2 var(--sign); letter-spacing: .03em; text-transform: uppercase; color: var(--ink); margin-top: 10px; }
.side a { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 4px; color: var(--ink); text-decoration: none; }

.side ol ol { padding-left: 8px; }
main { min-width: 0; display: grid; gap: 26px; align-content: start; }
.cat-head h2 { font: 800 46px/1 var(--sign); text-transform: uppercase; margin: 0; text-wrap: balance; }
.cat-head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; max-width: 72ch; }
.note { font: 13px/1.45 var(--body); color: var(--muted); border: 1px dashed var(--rule); border-radius: 6px; padding: 8px 12px; max-width: 72ch; }

.best b { font-weight: 600; } .best .v { font-style: italic; color: var(--muted); }
section.shelf { display: grid; gap: 10px; scroll-margin-top: calc(var(--hh, 150px) + 12px); }

h4.shelf-name span { font: 500 12px/1 var(--mono); color: var(--muted); text-transform: none; letter-spacing: 0; }

.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; align-items: start; }
article.item { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 11px 13px; display: grid; gap: 5px; min-width: 0; }
article.item h5 { font: 600 16.5px/1.3 var(--body); margin: 0; }
.also { font: 13px/1.4 var(--body); color: var(--muted); margin: 0; }
.desc { font: 14.5px/1.5 var(--body); margin: 0; }
details.models summary { cursor: pointer; font: 600 13px/1.3 var(--body); color: var(--accent); list-style: none; }
details.models summary::-webkit-details-marker { display: none; }
details.models summary::before { content: "+ "; font-family: var(--mono); }
details.models[open] summary::before { content: "− "; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; max-height: 320px; overflow-y: auto; }
.chip { font: 13px/1.3 var(--body); background: var(--soft); border-radius: 4px; padding: 3px 7px; }
.chip i { font-style: normal; color: var(--muted); margin-left: 5px; }
.chip.range { background: transparent; border: 1px solid var(--rule); }
.src { font: 12px/1.3 var(--mono); margin: 0; } .src a { color: var(--muted); }
.none { color: var(--muted); font: 15px/1.5 var(--body); }
.hits { display: grid; gap: 4px; }
.hit { display: flex; justify-content: space-between; gap: 12px; text-align: left; font: 15px/1.4 var(--body); padding: 7px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); cursor: pointer; }
.hit i { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
.modes { display: flex; gap: 4px; }
.modes button { font: 600 13px/1 var(--body); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
section.scene { display: grid; gap: 8px; scroll-margin-top: calc(var(--hh, 150px) + 12px); }
section.scene h4 { font: 700 21px/1.1 var(--sign); letter-spacing: .02em; text-transform: uppercase; margin: 0; border-bottom: 1px solid var(--rule); padding-bottom: 4px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
section.scene h4 span { font: 500 12px/1 var(--mono); color: var(--muted); text-transform: none; letter-spacing: 0; }
section.scene > p { margin: 0; font-size: 15px; max-width: 72ch; }
.brands { display: flex; flex-wrap: wrap; gap: 6px; }
details.brand { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; font-size: 14px; }
details.brand.core { border-left: 4px solid var(--accent); }
details.brand summary { cursor: pointer; padding: 6px 10px; list-style: none; font-weight: 600; }
details.brand summary::-webkit-details-marker { display: none; }
details.brand summary i { font-style: normal; font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
details.brand div { padding: 0 10px 8px; color: var(--muted); font-size: 13px; max-width: 46ch; }
mark { background: var(--flag); color: var(--flag-ink); padding: 0 1px; border-radius: 2px; }
@media (max-width: 880px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; } nav.side { position: static; max-height: 260px; border: 1px solid var(--rule); border-radius: 6px; padding: 10px; background: var(--paper); } #q { margin-left: 0; width: 100%; } header { position: static; } section.dept, section.shelf { scroll-margin-top: 12px; } .cat-head h2 { font-size: 36px; } }
@media (max-width: 560px) { .items { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

#views { display: flex; flex-wrap: wrap; gap: 4px; }
#views button { font: 600 13px/1 var(--body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; }

article.item.wide { grid-column: 1 / -1; }

.mode { font: 500 12px/1 var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 8px; margin-left: 10px; vertical-align: middle; }
.brows { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 12px; align-items: start; }

nt":0,"ns":0},{"c":"D2","n":"Phones, Tablets & Personal Devices","d":"D","k":78,"nb":159,"nt":0,"ns":0},{"c":"D3","n":"Audio & Video","d":"D","k":93,"nb":171,"nt":0,"ns":0},{"c":"D4","n":"Cameras & Photography","d":"D","k":145,"nb":237,"nt":0,"ns":0},{"c":"E1","n":"Toys & Games","d":"E","k":201,"nb":310,"nt":23,"ns":0},{"c":"E2","n":"Sports, Fitness & Recreation","d":"E","k":408,"nb":552,"nt":7,"ns":0},{"c":"E3","n":"Musical Instruments & Music Gear","d":"E","k":260,"nb":327,"nt":36,"ns":0},{"c":"E4","n":"Weapons & Armour","d":"E","k":235,"nb":102,"nt":14,"ns":0},{"c":"E5","n":"Video Games","d":"E","k":104,"nb":121,"nt":0,"ns":0},{"c":"E6","n":"Observing & Measuring","d":"E","k":104,"nb":136,"nt":4,"ns":0},{"c":"F1","n":"Media & Publications","d":"F","k":174,"nb":276,"nt":11,"ns":0},{"c":"F2","n":"Art","d":"F","k":141,"nb":95,"nt":66,"ns":0},{"c":"F3","n":"Coins, Stamps, Medals & Trading Cards","d":"F","k":108,"nb":136,"nt":0,"ns":0},{"c":"F4","n":"Religious & Ceremonial Objects","d":"F","k":156,"nb":18,"nt":17,"ns":0},{"c":"F5","n":"Documents & Personal Records","d":"F","k":84,"nb":649,"nt":0,"ns":0},{"c":"F6","n":"Natural History & Specimens","d":"F","k":345,"nb":28,"nt":6,"ns":187},{"c":"G1","n":"Vehicles","d":"G","k":247,"nb":738,"nt":8,"ns":0},{"c":"G2","n":"Property & Structures","d":"G","k":81,"nb":51,"nt":85,"ns":0},{"c":"G3","n":"Home Fixtures & Features","d":"G","k":136,"nb":246,"nt":8,"ns":0},{"c":"H1","n":"Personal Care & Beauty","d":"H","k":168,"nb":1472,"nt":32,"ns":0},{"c":"H2","n":"Health, Medical & Mobility","d":"H","k":192,"nb":433,"nt":5,"ns":0},{"c":"H3","n":"Adult Objects","d":"H","k":61,"nb":64,"nt":0,"ns":0},{"c":"H4","n":"Fragrance","d":"H","k":48,"nb":585,"nt":5,"ns":0},{"c":"I1","n":"Software","d":"I","k":162,"nb":753,"nt":0,"ns":0},{"c":"I2","n":"Digital Media & Items","d":"I","k":80,"nb":140,"nt":0,"ns":0},{"c":"I3","n":"Subscriptions, Memberships & Online Services","d":"I","k":93,"nb":805,"nt":0,"ns":0},{"c":"J1","n":"Meat & Poultry","d":"J","k":170,"nb":113,"nt":9,"ns":0},{"c":"J2","n":"Fish & Seafood","d":"J","k":172,"nb":77,"nt":10,"ns":0},{"c":"J3","n":"Dairy, Eggs & Alternatives","d":"J","k":169,"nb":127,"nt":22,"ns":0},{"c":"J4","n":"Fruit & Vegetables","d":"J","k":258,"nb":41,"nt":4,"ns":0},{"c":"J5","n":"Pantry Staples","d":"J","k":280,"nb":156,"nt":5,"ns":0},{"c":"J6","n":"Coffee, Tea & Cocoa","d":"J","k":74,"nb":131,"nt":11,"ns":0},{"c":"J7","n":"Wine, Beer & Spirits","d":"J","k":392,"nb":757,"nt":33,"ns":0},{"c":"J8","n":"Bakery, Sweets & Snacks","d":"J","k":143,"nb":1018,"nt":39,"ns":0},{"c":"J9","n":"Soft Drinks & Water","d":"J","k":104,"nb":1294,"nt":7,"ns":0},{"c":"J10","n":"Smoking & Vaping","d":"J","k":133,"nb":195,"nt":12,"ns":0}],"index":[],"nolow":[["J7","AB InBev brands","Stella Artois","Stella Artois 0.0","alcohol-free"],["J7","AB InBev brands","Beck's","Beck's Blue","alcohol-free"],["J7","AB InBev brands","Corona","Corona Cero","alcohol-free"],["J7","AB InBev brands","Budweiser","Budweiser Zero","alcohol-free"],["J7","Heineken brands","Buckler","","low"],["J7","Heineken brands","Heineken","Heineken 0.0","alcohol-free"],["J7","Carlsberg brands","Carlsberg","Carlsberg 0.0","alcohol-free"],["J7","Asahi brands","Peroni","Peroni Libera 0.0%","alcohol-free"],["J7","Asahi brands","Peroni","Peroni Nastro Azzurro 0.0%","alcohol-free"],["J7","Asahi brands","Asahi Super Dry","Asahi Super Dry 0.0%","alcohol-free"],["J7","Asahi brands","Asahi Super Dry","Asahi Dry Zero","alcohol-free"],["J7","Kirin brands","Kirin Lager","Kirin Zero ICHI","alcohol-free"],["J7","Southeast Asia: national and regional brands","San Miguel Pale Pilsen","San Mig Zero","alcohol-free"],["J7","Independent brewers in Europe","Budějovický Budvar","Budvar Free","low"],["J7","Independent brewers in Europe","Clausthaler","Clausthaler Classic Premium Alkoholfrei","de-alcoholised"],["J7","Independent brewers in Europe","Erdinger","Erdinger Alkoholfrei","de-alcoholised"],["J7","Independent brewers in Europe","Guinness","Guinness 0.0","alcohol-free"],["J7","Independent brewers in Europe","Swinkels (Bavaria, La Trappe, Rodenbach)","Bavaria 0.0","alcohol-free"],["J7","Independent brewers in Europe","San Miguel (Spain)","San Miguel 0,0","alcohol-free"],["J7","Independent brewers in Asia, Africa and Oceania","Sapporo","Super Clear","low"],["J7","Alcohol-free beer specialists","Athletic Brewing","","de-alcoholised"],["J7","Alcohol-free beer specialists","Lucky Saint","","de-alcoholised"],["J7","Alcohol-free beer specialists","sörzero","","alcohol-free"],["J7","Alcohol-free wine","Torres Natureo","","de-alcoholised"],["J7","Alcohol-free sparkling wine","Noughty","","alcohol-free"],["J7","Alcohol-free sparkling wine","Natureo Sparkling","","de-alcoholised"],["J7","Non-alcoholic spirit","Seedlip","","alcohol-free"],["J7","Non-alcoholic spirit","Lyre's","","alcohol-free"],["J7","Non-alcoholic spirit","Pentire","","alcohol-free"],["J7","Non-alcoholic spirit","Ritual Zero Proof","","alcohol-free"],["J7","Alcohol-free aperitif","Sanbittèr","","alcohol-free"],["J7","Alcohol-free aperitif","Crodino","","alcohol-free"],["J7","Alcohol-free aperitif","Everleaf","","alcohol-free"]],"fw":{"version":"0.8","intro":["This taxonomy maps the kinds of things a person owns for everyday life and for their hobbies. Read it from the top down: ten domains group neighbouring categories; each category has departments and shelves; shelves hold kinds (generic types of object, such as a chef's knife or a field jacket); a collected kind runs on to named archetypes (an icon, pattern or model family) and their versions (generations, editions, reissues, reproductions).","Each department is marked with a mode. Variety means people explore and collect many makers, so every notable maker and named form is listed, with the long tail as short entries. Tier means people want to pick a good one, so the list keeps the makers that cover most of the market and the ones that top independent tests. Mixed means tier for the everyday end and variety for the enthusiast end.","Every object has one home. To find it, answer the questions of the placement key in order and stop at the first yes. Cross-links point to neighbouring homes and to related taxonomies (entertainment titles, pursuits, dishes); they never give an object a second home.","Makers, craft traditions, scenes, periods and other registers are separate views over the same objects: they help you browse, but they never decide where an object lives."],"key":["1. Outside the scope of this taxonomy (a one-off service or single-event ticket, a bank or crypto balance, a title, a genre, a pursuit, a dish or recipe, trade-only equipment)? → not filed","2. A living animal, not sold alive to be eaten? → breeds and species register (no category)","3. Made to diagnose, treat, monitor or compensate for an illness, injury or disability, or for contraception, fertility, pregnancy, breastfeeding or first aid, and not built into the home? → H2 Health, Medical & Mobility","4. A living plant, fungus or culture, a fresh-cut ornamental plant or tree, or a seed, bulb, spore or cutting for growing? → C3 Plants & Living Cultures","5. Tobacco, nicotine, cannabis or another plant product taken for its effect, or gear made to smoke, vape or store it? → J10 Smoking & Vaping","6. An alcoholic drink in a sealed container, or a no- or low-alcohol version of beer, wine, cider or spirits? → J7 Wine, Beer & Spirits","7. A ready-to-drink soft drink, bottled water, juice, cordial or drink syrup, fermented soft drink, energy or sports drink, or ready-to-drink coffee or tea? → J9 Soft Drinks & Water","8. Coffee, tea, cocoa or another plant infusion bought to brew or mix at home? → J6 Coffee, Tea & Cocoa","9. Bread or other baked goods, biscuits, crackers, chocolate, sweets, crisps and savoury snacks, nuts, snack bars or ice cream? → J8 Bakery, Sweets & Snacks","10. Meat, poultry or game in any form, a meat product, or a meat alternative? → J1 Meat & Poultry","11. Fish or seafood in any form, live shellfish sold to eat included? → J2 Fish & Seafood","12. Milk, cream, butter, yoghurt, cheese, eggs, infant formula, or a plant alternative to them, or tofu, tempeh or yuba? → J3 Dairy, Eggs & Alternatives","13. Fresh fruit, vegetables, salad, herbs, mushrooms or sea vegetables, sold to eat? → J4 Fruit & Vegetables","14. Any other food bought to eat or cook with, packaged prepared foods included? → J5 Pantry Staples","15. Land, a dwelling or estate as a whole, a home that floats or is factory-built, or a burial place? → G2 Property & Structures","16. Built into or fixed to a home or its grounds as part of it, or a home system (heating, water, power, controls), or a sauna or hot tub of any kind? → G3 Home Fixtures & Features","17. Software: a program, app or hosted tool valued for what it does? → I1 Software","18. An item that exists only as data (font, creative asset, game or platform item, personal media file, domain, NFT)? → I2 Digital Media & Items","19. A subscription, membership, pass, connectivity plan, online utility service, recurring delivery or retained service? → I3 Subscriptions, Memberships & Online Services","20. A natural object, not made by people beyond cleaning, cutting or preserving, kept as a specimen? → F6 Natural History & Specimens","21. A part, attachment, case or consumable made for one kind of object? → the category of that object","22. Made for sexual stimulation or for restraint in sexual activity, or for their care? → H3 Adult Objects","23. A weapon for fighting, self-defence, hunting or target shooting, its ammunition, sights or parts, armour, or a deactivated or replica weapon? → E4 Weapons & Armour","24. Made mainly to move people or goods, a motorcycle rider's helmet or gear, or a product made for vehicle care? → G1 Vehicles","25. Farm, smallholding or woodland machinery or livestock equipment? → C7 Farm & Forestry Equipment","26. Made to keep, feed, house, carry, train or care for animals? → B10 Animal Equipment","27. Made for worship, devotion, divination or mourning, or as ceremonial regalia or insignia of office? → F4 Religious & Ceremonial Objects","28. Money, bullion, a stamp or postal item, a trading card, token, medal, decoration or trophy, or a holder or album made for them? → F3 Coins, Stamps, Medals & Trading Cards","29. A personal or collected paper or card: a letter, autograph, manuscript, photograph, postcard, ephemera, share, payment or transit card, identity or legal document? → F5 Documents & Personal Records","30. An original or editioned work of art, or a collectible figurine made as an ornament? → F2 Art","31. A published work on a physical carrier (book, record, disc, tape, film, comic, periodical, sheet music, map, globe), or storage made for such media? → F1 Media & Publications","32. Video-game hardware, game media as objects, a VR or XR headset, or an arcade or pinball machine? → E5 Video Games","33. A musical instrument or gear for making, amplifying, recording or DJing music? → E3 Musical Instruments & Music Gear","34. Made to observe the sky, nature or the very small, or to measure weather and the Earth, for study or hobby? → E6 Observing & Measuring","35. A computer, its components, storage, peripherals, printers, networking, cables or maker electronics? → D1 Computers & Components","36. A phone, tablet, e-reader, wearable, organiser, navigator or tracker, or a two-way or amateur radio? → D2 Phones, Tablets & Personal Devices","37. Equipment for listening to sound or watching pictures (headphones, speakers, hi-fi, radio, TV, projector, players, smart speakers)? → D3 Audio & Video","38. A camera, lens or other equipment for taking or making photographs and video? → D4 Cameras & Photography","39. A watch, clock or timer made to show or measure time? → A5 Clocks & Watches","40. Made for play, or for a game played at a table or with cards, dice, tiles or tokens, or a hobby model? → E1 Toys & Games","41. Made for a sport, fitness, dance or outdoor recreation, including garments, footwear and helmets made for one sport? → E2 Sports, Fitness & Recreation","42. Protective equipment worn against a work or workshop hazard (hard hat, safety glasses, respirator, ear defenders, hi-vis, cut-resistant clothing)? → C1 Tools & Workshop Equipment","43. Footwear? → A2 Footwear","44. A garment, headwear, scarf, glove, belt, hosiery, uniform, costume or traditional dress? → A1 Clothing","45. An ornament worn on the body, hair or clothing? → A3 Jewellery","46. A bag, wallet or small leather good, eyewear frame or sunglasses, luggage, umbrella, hand fan, baby carrier or other carried accessory? → A4 Bags & Accessories","47. A fragrance worn on the body, or a bottle, sample or material for it? → H4 Fragrance","48. Made to be used on the body for grooming, hygiene, cosmetics or comfort? → H1 Personal Care & Beauty","49. A material, tool or machine for making things by hand (paint, paper, fabric, yarn, beads, clay, glass, leather, model paints)? → C4 Craft & Art Supplies","50. Made for growing plants, keeping gardens, grounds and pools, or cooking and heating outdoors? → C2 Garden & Grounds","51. Made for writing, paper and desk work, or calculating? → C5 Office & Stationery","52. Made to prepare, cook, brew, serve or store food and drink? → B5 Kitchen & Dining","53. Made to clean the home or its textiles, or to collect waste? → B6 Cleaning & Laundry","54. A movable appliance that heats, cools, moves, cleans or dries a room's air? → B7 Portable Climate & Air","55. Movable equipment made to secure or protect a home and its people, or to keep pests out? → B8 Home Safety & Security","56. A movable light, bulb, shade or lighting part? → B3 Lighting","57. Movable furniture or storage? → B1 Furniture & Storage","58. A household textile (rug, bedding, cushion, curtain, blind, towel, table linen)? → B2 Soft Furnishings","59. Made to decorate a home or garden, or for a celebration effect? → B4 Decor","60. A tool, instrument or machine made to cut, shape, join, measure, lift, power or repair? → C1 Tools & Workshop Equipment","61. A building material, hardware item or supply bought loose (timber, masonry, paint, plumbing, electrical, fixings, adhesives, packing, batteries, fuel)? → C8 Building Materials & Hardware","62. None of the above? → hold and log for review"],"cats":{"A1":{"test":"a garment, headwear, scarf, glove, belt, hosiery, uniform, costume or traditional dress worn on the body for everyday, formal or work wear.","prec":["Garments, footwear and helmets made for one sport are E2; motorcycle riding gear is G1.","Protective equipment worn against a work hazard (hard hats, respirators, hi-vis, chainsaw trousers) is C1.","Religious dress and vestments, fetish wear and toy dress-up crowns and wands: A1, A1 and E1.","Wigs, hairpieces and hair ties are H1."]},"A2":{"test":"anything worn on the foot, including work, riding and traditional footwear, with shoe care.","prec":["Footwear made for one sport (football boots, ski boots, climbing shoes) is E2.","Shoe polish and shoe care are A2, not B6; orthotic insoles made to treat are H2."]},"A3":{"test":"an ornament worn on the body, hair or clothing, including amulets, piercing jewellery, traditional jewellery and jewellery parts.","prec":["Smart rings are D2; medical ID jewellery is H2; watches are A5.","Plain hair ties and clips are H1; loose gemstones and pearls are F6; patches sold to sew on are C4."]},"A4":{"test":"a bag, wallet, small leather good, eyewear frame or sunglasses, luggage, umbrella, hand fan, baby carrier or other accessory carried on the person.","prec":["All frames, sunglasses and reading glasses are A4; spectacle and contact lenses are H2.","A case made for one object follows it; tool bags are C1; cool bags B5.","Quivers, chalk bags and hydration packs are E2; sword canes are E4."]},"A5":{"test":"a watch, clock or timer whose main function is to show or measure time, with its straps, storage and parts.","prec":["Smartwatches and hybrid smartwatches are D2; clock radios and smart displays D3.","Chess and game clocks are E1; kitchen timers B5; a garden sundial is B4."]},"B1":{"test":"movable furniture made to sit, lie, work at, display or store things, indoors or out, including nursery furniture, racks, boxes and organisers.","prec":["Fitted kitchens, wardrobes and other fitted storage are G3.","Workbenches and tool storage are C1; camp chairs and tables are E2; desk organisers C5.","Albums and binders for collected objects follow what they hold (F3, F5)."]},"B2":{"test":"a household textile: rug or mat, bedding, blanket, cushion, curtain or blind, towel, or table and kitchen linen.","prec":["Fitted flooring is G3; a hair towel is H1; furnishing fabric sold by the metre to sew is B2."]},"B3":{"test":"a movable light (lamp, ceiling or wall light, decorative or outdoor light, torch, lantern) or a bulb, strip, shade or lamp part.","prec":["Built-in fittings (recessed downlights, track, under-cabinet) are G3.","Candles and candle holders are B4; studio and photo lights D4; grow lights C2; aquarium lights B10."]},"B4":{"test":"an object made to decorate a home or garden, or a celebration effect: vases, mirrors, wall decor, candles, home fragrance, incense, seasonal and folk decor, fireworks, artificial plants, garden ornaments, flags.","prec":["Decorative lighting is B3; works of art and collectible figurines are F2.","Incense made for a rite is F4; perfume worn on the body is H4.","Decorative replica weapons are E4."]},"B5":{"test":"an object made to prepare, cook, brew, serve or store food and drink: cookware, kitchen knives, tools, appliances, coffee and tea equipment, tableware, glassware, preserving gear.","prec":["Barbecues, smokers and pizza ovens are C2; camp stoves E2.","Built-in and range cookers, fitted sinks and built-in wine cabinets are G3; freestanding ones stay B5.","Pocket and utility knives are C1; fighting and hunting knives E4."]},"B6":{"test":"equipment, tools and products made to clean a home or its textiles, or to collect waste.","prec":["Shoe care is A2; vehicle care G1; adult-product cleaners H3; pool cleaners C2.","Central vacuum and waste disposal units are G3; aquarium cleaning tools B10."]},"B7":{"test":"a movable appliance that heats, cools, moves, cleans, humidifies or dries the air of a room, or monitors indoor air quality.","prec":["Built-in heating, cooling, ventilation, ceiling fans and heated towel rails are G3.","Patio heaters and fire pits are C2; electric blankets B2; heated low tables B1."]},"B8":{"test":"a movable object made to secure a home, its people and its contents, or to keep pests out: locks, safes, alarm kits, cameras, doorbells, fire and leak detectors, child safety, pest control.","prec":["Door and window locks, multipoint and smart locks included, are B8.","Installed intruder alarms, intercoms and window guards are G3; bicycle and vehicle locks G1.","Skin-applied insect repellent is H1; GPS pet trackers B10."]},"B10":{"test":"equipment, food and supplies made to keep, feed, house, carry, train or care for animals, by animal (dogs, cats, fish and ponds, horses, birds, small animals, reptiles, bees).","prec":["The animals themselves are in the breeds and species register.","Farm-scale livestock equipment is C7; backyard flocks and leisure horses stay B10.","Riders' helmets are E2 and riding boots A2; pet urns F4."]},"C1":{"test":"a tool, instrument or machine made to cut, shape, join, measure, lift, power or repair, or protective equipment worn against a work hazard.","prec":["Pocket, EDC and bushcraft knives, multi-tools, axes and hand log splitters are C1.","Tractor-driven splitters and sawmills are C7; chainsaws C2; vehicle jacks and axle stands G1.","Building and trade measuring tools are C1; observing and weather instruments E6."]},"C2":{"test":"equipment and supplies made for growing plants or keeping gardens, grounds and pools, or for cooking and heating outdoors.","prec":["Living plants and seeds are C3; garden furniture B1; garden ornaments B4.","Garden buildings, in-ground pools and built-in outdoor kitchens are G3; above-ground and inflatable pools C2.","Landscaping stone and aggregates are C8."]},"C3":{"test":"a living plant, fungus or culture kept to grow or propagate, a fresh-cut ornamental plant or Christmas tree, or a seed, bulb, spore or cutting for growing.","prec":["Cut produce and herbs sold to eat are J4; a plant sold still growing is C3.","Dried and artificial plants are B4; dried baking yeast is J5."]},"C4":{"test":"a material, tool or machine for making things by hand, grouped by material: paint, paper, fabric, yarn, beads, clay, glass, resin, wax, leather, model paints.","prec":["Writing pens and pencils are C5; model kits E1; finished candles B4.","Woodworking and metalworking tools are C1; craft stamps C4, office rubber stamps C5."]},"C5":{"test":"an object made for writing, paper and desk work or calculating: pens, ink, notebooks, paper, seals and stamps, filing, calculators, collector machines (typewriters, slide rules).","prec":["Printers and scanners are D1; packing materials C8; storage boxes B1."]},"C7":{"test":"machinery and equipment made for farm, smallholding or woodland production: tractors and implements, vintage tractors and stationary engines, farm-scale machines, livestock equipment.","prec":["Lawn and garden tractors and ride-on mowers are C2.","Beekeeping is B10; equipment for a few backyard hens or leisure horses is B10."]},"C8":{"test":"a raw building supply, hardware item or household consumable bought loose: timber, masonry, heritage materials, stone, fencing, paint, plumbing, electrical, fixings, adhesives, packing, batteries, fuel.","prec":["A finished fitting installed in a home (door, window, tap, switch, fitted floor) is G3.","Pocket lighters are J10; utility lighters and matches C8.","Battery packs for one tool platform are C1; standard cells C8."]},"D1":{"test":"a computer, its components, storage, monitors and peripherals, printers and 3D printers, networking, cables and hubs, security keys, enthusiast keyboards, or maker electronics.","prec":["Consoles, handheld gaming PCs and VR headsets are E5.","Speech microphones are D1; music microphones and audio interfaces E3.","An electronic toy made for play, such as a coding robot, is E1."]},"D2":{"test":"a phone, tablet, e-reader, wearable (smartwatch, fitness band, smart ring, smart glasses), organiser, navigator, tracker, or two-way or amateur radio.","prec":["A watch whose main display is the time is A5; GPS pet trackers B10.","Electronics fitted to a vehicle (car audio, dashcam, mounted sat-nav) are G1."]},"D3":{"test":"equipment for listening to sound or watching pictures: headphones, loudspeakers, turntables, hi-fi, portable players, radios, TVs, projectors, video players, smart speakers and displays.","prec":["Studio, stage and DJ gear is E3; records and discs F1."]},"D4":{"test":"a camera, lens, flash, studio light, tripod, film or darkroom item, or another accessory for taking or making photographs and video.","prec":["Security cameras are B8; dashcams G1; telescope and astro cameras E6."]},"E1":{"test":"an object made for play or a hobby model, or for a game played at a table or with cards, dice, tiles or tokens, or a science-discovery kit.","prec":["Board and card games are filed as objects; their titles are out of scope.","Toy blasters and swords are E1; airsoft and paintball E2; real weapons E4.","A single-line play kite is E1; sport and traction kites E2. Card sleeves and deck boxes are E1."]},"E2":{"test":"equipment made for a sport, fitness, dance or outdoor recreation, including camping, fishing and hunting accessories and garments, footwear and helmets made for one sport.","prec":["Bows, firearms and hunting knives are E4; quivers, calls, decoys and tree stands E2.","Cycling helmets and clothing are E2; bicycles and their components G1.","Garden trampolines are E1; fitness trampolines E2; cool boxes B5."]},"E3":{
